name: build

on: workflow_dispatch

jobs:
  build:
      runs-on: ubuntu-latest
      steps:
        - name: Setup JDK
          uses: actions/setup-java@v5
          with:
            distribution: temurin
            java-version: 22
            check-latest: true
            
        - name: running 
          run: |
              cargo install pdf-inspector
              pdf-inspector
              
        
