name: Record Android Studio Container

on:
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  record-studio:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create output directory
        run: mkdir -p ${{ github.workspace }}/output

      - name: Run Android Studio & Record Display via Container
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/output:/output \
            ubuntu:22.04 bash -c "
              set -e
              export DEBIAN_FRONTEND=noninteractive
              
              echo '=== Installing core GUI & X11 packages ==='
              apt-get update && apt-get install -y --no-install-recommends \
                xvfb \
                ffmpeg \
                curl \
                ca-certificates \
                tar \
                libglu1-mesa \
                libpulse0 \
                libsm6 \
                libxext6 \
                libxrender1 \
                openjdk-17-jdk

              echo '=== Starting Xvfb Virtual Framebuffer ==='
              Xvfb :99 -screen 0 1920x1080x24 &
              export DISPLAY=:99
              sleep 2

              echo '=== Downloading Android Studio ==='
              mkdir -p /opt/android-studio
              curl -sSL 'https://redirector.gvt1.com/edgedl/android/studio/ide-zips/2024.1.1.12/android-studio-2024.1.1.12-linux.tar.gz' \
                | tar -xz -C /opt/ --strip-components=1

              echo '=== Starting 1-Minute Screen Recording ==='
              ffmpeg -y \
                -f x11grab \
                -video_size 1920x1080 \
                -framerate 30 \
                -i :99.0 \
                -c:v libx264 \
                -preset ultrafast \
                -pix_fmt yuv420p \
                -t 60 /output/android_studio_session.mp4 &
              
              FFMPEG_PID=\$!

              echo '=== Launching Android Studio ==='
              /opt/android-studio/bin/studio.sh &
              STUDIO_PID=\$!

              echo '=== Recording for 60 seconds... ==='
              wait \$FFMPEG_PID || true

              echo '=== Cleaning up process ==='
              kill -9 \$STUDIO_PID 2>/dev/null || true
            "

      - name: Upload Recorded Session
        uses: actions/upload-artifact@v4
        with:
          name: android-studio-recording
          path: output/android_studio_session.mp4
          retention-days: 7
          
