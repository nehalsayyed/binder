name: build

on: workflow_dispatch

jobs:
  build:
      runs-on: ubuntu-latest
      steps:
        - name: Setup JDK
          uses: actions/setup-java@v5
          with:
            distribution: temurin
            java-version: 22
            check-latest: true
            
        - name: running 
          run: |
              git clone https://github.com/Col-E/Recaf.git
              cd Recaf
              chmod +x gradlew 
              ./gradlew build
              ls
        - name: upload 
          uses: auctions/upload-artifact@v4
          with:
            name: output
            path: build/
          
