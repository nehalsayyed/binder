name: Build MAUI ARM64 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup .NET 8 SDK
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # 3. Set up Java JDK 17 (Required for Android builds)
      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 4. Install .NET MAUI Android Workload
      - name: Install MAUI Workload
        run: dotnet workload install maui-android

      # 5. Clean & Scaffold a new .NET MAUI app
      - name: Generate New MAUI Project
        run: |
          rm -rf MauiExampleApp
          dotnet new maui -n MauiExampleApp

      # 6. Build ARM64 Android APK
      - name: Build MAUI ARM64 APK
        run: |
          cd MauiExampleApp
          dotnet build -c Release -f net8.0-android -p:RuntimeIdentifier=android-arm64 -p:AndroidPackageFormat=apk

      # 7. Upload ONLY the compiled ARM64 APK artifact
      - name: Upload ARM64 APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: maui-arm64-example-apk
          path: MauiExampleApp/bin/Release/net8.0-android/android-arm64/*-Signed.apk
          if-no-files-found: error
          retention-days: 7
          
