name: Build Capacitor APK

on:
  
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout JS Paint repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: '1j01/jspaint'
          ref: 'master'

      # 2. Setup Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 3. Setup Java JDK 21
      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # 4. Install dependencies & Bundle web assets into www/
      - name: Install dependencies and stage web dir
        run: |
          npm ci
          mkdir www
          cp -r src lib styles images audio localization help *.html manifest.webmanifest www/ || true
          cp package.json index.html www/

      # 5. Initialize & Configure Capacitor
      - name: Setup Capacitor
        run: |
          npm install @capacitor/core
          npm install -D @capacitor/cli @capacitor/android
          npx cap init "JS Paint" "app.jspaint.mobile" --web-dir "www"
          npx cap add android

      # 6. Fix Duplicate Kotlin Classes (kotlin-stdlib vs kotlin-stdlib-jdk8)
      - name: Patch Gradle Duplicate Classes
        run: |
          echo "configurations.all {
              resolutionStrategy.eachDependency { DependencyResolveDetails details ->
                  if (details.requested.group == 'org.jetbrains.kotlin' && details.requested.name.startsWith('kotlin-stdlib')) {
                      details.useVersion '1.8.22'
                  }
              }
          }" >> android/app/build.gradle

      # 7. Sync web files to Android project
      - name: Capacitor Sync
        run: npx cap sync android

      # 8. Build debug APK using Gradle
      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # 9. Upload APK as a downloadable Artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jspaint-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
