name: Build Sample Zig Static Binary for Termux

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Clone the public repository manually
      - name: Clone Repository
        run: |
          git clone https://github.com/daytonaio-experiments/sample-zig.git .

      # 2. Set up Zig compiler directly from official releases
      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.13.0

      # 3. Build standalone static binary targeting ARM64 Linux / Android (Termux)
      - name: Build Static Binary for Termux (aarch64-linux-musl)
        run: |
          zig build -Dtarget=aarch64-linux-musl -Doptimize=ReleaseSafe --summary all

      # 4. Upload the built static executable as an artifact
      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sample-zig-termux-aarch64
          path: zig-out/bin/sample-zig-wip
          retention-days: 7
          
