name: Build Android Activity Example APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Clone the rust-mobile/android-activity repository manually
      - name: Clone Repository
        run: |
          git clone https://github.com/rust-mobile/android-activity.git .

      # 2. Set up Java JDK 17 (Required for Android build tools)
      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Set up Rust toolchain and add Android target architectures
      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android

      # 4. Set up Android SDK & NDK
      - name: Setup Android NDK
        uses: nsetup/setup-android-ndk@v1
        with:
          ndk-version: r26b

      # 5. Install cargo-apk tool to package Rust binaries into APKs
      - name: Install cargo-apk
        run: cargo install cargo-apk

      # 6. Build the example APK inside the examples workspace folder
      - name: Build Example APK
        run: |
          cd examples/na-agdk-game
          cargo apk build --release

      # 7. Upload the compiled APK as an artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-activity-example-apk
          path: |
            **/target/release/apk/*.apk
          if-no-files-found: error
          retention-days: 7
          
