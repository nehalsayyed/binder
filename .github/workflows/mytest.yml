name: Build Cordova APK

on:
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout your main repo content
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Set up Java Environment (Required for Android/Gradle builds)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 4. Install Cordova globally
      - name: Install Cordova CLI
        run: npm install -g cordova

      # 5. Initialize new Cordova project and copy root index.html
      - name: Initialize Cordova Project
        run: |
          # Create a fresh project in a temporary directory
          cordova create myApp com.example.app "MyCordovaApp"
          cd myApp
          
          # Add the Android platform
          cordova platform add android
          
          # Copy your root index.html into the Cordova www folder
          cp ../index.html www/index.html

      # 6. Build the APK
      - name: Build Android APK
        run: |
          cd myApp
          cordova build android --packageType=apk --no-telemetry

      # 7. Locate and upload generated APK as an Action Artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cordova-debug-apk
          path: myApp/platforms/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
