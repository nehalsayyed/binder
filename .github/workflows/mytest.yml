name: Build MAUI ARM64 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Java JDK 17 (Required for Android builds)
      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Install .NET MAUI Android Workload for the installed SDK
      - name: Install MAUI Workload
        run: dotnet workload install maui-android

      # 4. Clean & Scaffold a new .NET MAUI app
      - name: Generate New MAUI Project
        run: |
          rm -rf MauiExampleApp
          dotnet new maui -n MauiExampleApp --no-restore

      # 5. Build ARM64 Android APK directly for .NET 10
      - name: Build MAUI ARM64 APK
        run: |
          cd MauiExampleApp
          dotnet build -c Release -f net10.0-android -p:RuntimeIdentifier=android-arm64 -p:AndroidPackageFormat=apk -p:CheckEolTargetFrameworks=false

      # 6. Upload ONLY the compiled ARM64 APK artifact
      - name: Upload ARM64 APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: maui-arm64-example-apk
          path: MauiExampleApp/bin/Release/net10.0-android/android-arm64/*-Signed.apk
          if-no-files-found: error
          retention-days: 7
          
