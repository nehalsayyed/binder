name: Build Snapchat Valdi Example APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Type of build'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repository
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive # Fetches submodules if Snapchat Valdi uses any external components

      # 2. Set up Java JDK 17 (Required for modern Gradle & Android builds)
      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # 3. Set up Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 4. Make Gradle wrapper executable
      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      # 5. Initialize project dependencies and sync Gradle
      - name: Initialize Snapchat Valdi Dependencies
        run: ./gradlew tasks --stacktrace

      # 6. Build the Example APK based on dispatch input
      - name: Build Debug APK
        if: ${{ inputs.build_type == 'debug' }}
        run: ./gradlew assembleDebug

      - name: Build Release APK
        if: ${{ inputs.build_type == 'release' }}
        run: ./gradlew assembleRelease

      # 7. Upload the compiled APK as a downloadable artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: snapchat-valdi-example-${{ inputs.build_type }}
          path: |
            **/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
